# Standalone workspace so the project builds anywhere.
[workspace]
exclude = ["vendor/elyra", "vendor/portable-pty", "vendor/tiny_http"]

[package]
name = "splash"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "A cross-platform workspace for coding agents, powered by the Agent Client Protocol."
authors = ["Helge Sverre"]
repository = "https://github.com/HelgeSverre/splash"
homepage = "https://github.com/HelgeSverre/splash"
readme = "README.md"
# Documentation images and the marketing site are tracked in Git, but never
# shipped in the crate.
exclude = ["/screenshots/**", "/website/**", "/signing/**"]
keywords = ["acp", "coding-agents", "desktop", "cross-platform"]
categories = ["development-tools", "gui"]
default-run = "splash"

[lib]
path = "src/lib.rs"

[[bin]]
name = "splash"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["elyra/desktop", "elyra/system"]

[dependencies]
elyra = { path = "vendor/elyra", default-features = false, features = ["database"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
rust-embed = "8"
# ACP. The SDK's API moved a lot between majors — pin exactly.
agent-client-protocol = { version = "=2.2.0", features = ["unstable_session_fork"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = "0.3"
parking_lot = "0.12"
libc = "0.2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
ignore = "0.4.33"
notify-debouncer-full = "0.7.0"
portable-pty = { path = "vendor/portable-pty" }
base64 = "0.23.1"
tiny_http = { path = "vendor/tiny_http" }
http = "1"
toml = "1.1.6"
serde_yaml_ng = "0.10.0"

[dev-dependencies]
rmp-serde = "1"

# Embeds the icon and version details in splash.exe (no-op for other targets).
[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
