# Standalone workspace so the project builds anywhere.
[workspace]

[package]
name = "splash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A macOS workspace for coding agents, powered by the Agent Client Protocol."
authors = ["Helge Sverre"]
repository = "https://github.com/HelgeSverre/splash"
homepage = "https://github.com/HelgeSverre/splash"
readme = "README.md"
keywords = ["acp", "coding-agents", "desktop", "macos"]
categories = ["development-tools", "gui"]
default-run = "splash"

[lib]
path = "src/lib.rs"

[[bin]]
name = "splash"
path = "src/main.rs"

[dependencies]
elyra = { git = "https://github.com/kwhorne/elyra-framework", tag = "v0.8.0", features = ["system", "database"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
rust-embed = "8"
# ACP. The SDK's API moved a lot between majors — pin exactly.
agent-client-protocol = "=2.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = "0.3"
parking_lot = "0.12"
libc = "0.2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
ignore = "0.4.33"
notify-debouncer-full = "0.7.0"
portable-pty = "0.9.0"
base64 = "0.23.1"
tiny_http = "0.12.0"
http = "1"
toml = "1.1.6"
serde_yaml_ng = "0.10.0"
