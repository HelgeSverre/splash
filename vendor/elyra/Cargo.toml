[package]
name = "elyra"
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kwhorne/elyra-framework"
homepage = "https://elyracode.com/framework"
readme = "README.md"
description = "A Rust + Svelte 5 framework for hyper-responsive desktop apps. Laravel-inspired, compiled, binary."
keywords = ["desktop", "gui", "webview", "svelte", "framework"]
categories = ["gui", "web-programming", "development-tools"]

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry", "dep:muda", "dep:png"]
# Database drivers + migrations (pulls in sqlx via elyra-db).
database = ["dep:elyra-db", "elyra-db/specta"]
# AI SDK (agents, tools, structured output, images, embeddings) via elyra-ai.
ai = ["dep:elyra-ai"]
# System tray icon + menu.
tray = ["dep:tray-icon"]
# Auto-updater (ed25519-verified).
updater = ["dep:ed25519-dalek", "dep:semver", "dep:base64", "dep:ureq"]
# Native system integration: dialogs, shell-open, clipboard, notifications, paths.
system = ["desktop", "dep:rfd", "dep:open", "dep:arboard", "dep:notify-rust", "dep:dirs"]
# OS-level global keyboard shortcuts.
shortcuts = ["dep:global-hotkey"]
# Launch the app at login.
autostart = ["dep:auto-launch"]
# OS keychain / credential manager for tokens + secrets.
secrets = ["dep:keyring", "dep:zeroize"]
# Spawn + manage sidecar child processes (no extra crate; enables tokio bits).
sidecar = ["tokio/process", "tokio/io-util"]

[dependencies]
elyra-db = { git = "https://github.com/kwhorne/elyra-framework", tag = "v0.8.0", optional = true }
elyra-ai = { git = "https://github.com/kwhorne/elyra-framework", tag = "v0.8.0", optional = true }
tray-icon = { version = "0.24", optional = true }
ed25519-dalek = { version = "3", optional = true }
semver = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1" }
substrate-core = { git = "https://github.com/kwhorne/elyra-framework", tag = "v0.8.0" }
ureq = { version = "3", optional = true }
rfd = { version = "0.17", optional = true }
open = { version = "5", optional = true }
arboard = { version = "3", optional = true }
notify-rust = { version = "4", optional = true }
dirs = { version = "6", optional = true }
global-hotkey = { version = "0.8", optional = true }
auto-launch = { version = "0.6", optional = true }
parking_lot = { version = "0.12" }
jiff = { version = "0.2" }
regex-lite = { version = "0.1" }
sys-locale = { version = "0.3" }
elyra-macros = { git = "https://github.com/kwhorne/elyra-framework", tag = "v0.8.0" }
serde = { version = "1", features = ["derive"] }
rmp-serde = { version = "1.3" }
rmp = { version = "0.8" }
rmpv = { version = "1", features = ["with-serde"] }
tao = { version = "0.35", optional = true }
wry = { version = "0.55", optional = true, features = ["linux-body"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rust-embed = { version = "8" }
thiserror = { version = "2" }
# `serde_json` types `serde_json::Value` (codegen names it `JsonValue`); feature
# unification gives apps that depend on specta the same.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.12" }
specta-serde = { version = "0.0.12" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
zeroize = { version = "1", optional = true }

# Native application menus. On macOS this is also what makes ⌘C/⌘V/⌘X reach the
# webview; on Windows/Linux it renders a per-window menu bar.
[dependencies.muda]
version = "0.19"
optional = true

# Decodes the window icon outside macOS, where the bundle supplies it.
[target.'cfg(not(target_os = "macos"))'.dependencies.png]
version = "0.18"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.muda]
version = "0.19"
features = ["gtk"]
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rmp-serde = { version = "1.3" }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[dependencies.http]
version = "1"
