<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect to Splash</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101012;color:#ededee}body{margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:420px;margin:24px;padding:32px;border:1px solid #303034;border-radius:16px;background:#19191c}h1{font-size:26px;margin:0 0 12px}p{color:#aaaab3;line-height:1.6}label{display:block;margin:28px 0 8px;font-size:14px}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:8px;padding:12px;border:1px solid #48484d}input{background:#101012;color:inherit}button{margin-top:16px;background:#f5ce35;color:#151515;cursor:pointer}code{font-size:13px;color:#ededee;overflow-wrap:anywhere}input:focus-visible,button:focus-visible{outline:2px solid #f5ce35;outline-offset:3px}[role=alert]{color:#f2a2a2;font-size:14px}.brand{font-size:13px;color:#f5ce35;letter-spacing:2px;margin-bottom:24px}.note{font-size:13px}
</style><script src="/login.js" defer></script></head>
<body><main><div class="brand">SPLASH · SERVER</div><h1>Connect to your workspace</h1><p>Your agents and files live on the machine running Splash. Enter its server token to continue.</p>
<form id="login"><label for="token">Server token</label><input id="token" data-testid="login-token" name="token" type="password" required autocomplete="current-password" spellcheck="false"><button type="submit" data-testid="login-submit">Connect to server</button><p id="error" role="alert" data-testid="login-error"></p></form>
<p class="note">Find the token in <code>server.token</code> inside the server’s data folder. The server prints that file’s location when it starts.</p></main></body></html>
