name: Release

# Tag builds publish automatically after all gates pass. Branch dispatches only
# produce test artifacts. Publication is serialized and safe to retry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/release_pipeline.py

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS app
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPLE_APPLICATION_SIGNING_IDENTITY: ${{ vars.APPLE_APPLICATION_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Set temporary signing paths
        run: |
          echo "APPLE_SIGNING_KEYCHAIN=$RUNNER_TEMP/splash-signing.keychain-db" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/splash-notary.p8" >> "$GITHUB_ENV"

      - name: Import signing credentials
        env:
          APPLE_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_BASE64 }}
          APPLE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: scripts/import-signing-assets.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      # rata is Elyra's CLI: it builds the frontend, the release binary and the .app.
      - name: Install rata
        run: cargo install --locked --git https://github.com/kwhorne/elyra-framework --tag v0.8.0 ratatosk

      - name: Build and bundle
        run: |
          rata build
          rata bundle

      - name: Sign, notarize, and package
        id: package
        run: |
          app_path="target/release/bundle/Splash.app"
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$app_path/Contents/Info.plist")
          architecture=$(uname -m)
          zip="target/distrib/Splash-${version}-macos-${architecture}.zip"
          scripts/package-release.sh "$app_path" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: splash-macos-${{ matrix.os }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/splash-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/splash-notary.p8" "$RUNNER_TEMP/splash-signing.p12"

  publish:
    name: Publish complete release
    needs: [check, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: splash-*
          merge-multiple: true
          path: release-assets
      - name: Verify assets and publish (or resume a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: publish
        run: python3 scripts/release_pipeline.py
