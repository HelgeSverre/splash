name: Native packages
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Portable ZIP from https://sourceforge.net/projects/nsis/files/NSIS%203/
      # whose file listing publishes this SHA-256.
      NSIS_VERSION: '3.13'
      NSIS_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: packages
          workspaces: |
            . -> target
            . -> target/headless
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev pkg-config squashfs-tools appstream desktop-file-utils
      # NSIS comes from the project's own portable ZIP, pinned and checksum
      # verified, and is cached so most runs never download it. Chocolatey's
      # feed went down for whole runs, which blocked CI and releases.
      - name: Restore Windows installer tool
        id: nsis
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.tool_cache }}/nsis-${{ env.NSIS_VERSION }}
          key: nsis-${{ env.NSIS_VERSION }}-${{ env.NSIS_SHA256 }}
      - name: Windows installer tool
        if: runner.os == 'Windows'
        run: |
          nsis="$(cygpath -u "$RUNNER_TOOL_CACHE")/nsis-$NSIS_VERSION"
          if [[ ! -x "$nsis/Bin/makensis.exe" ]]; then
            zip="$(cygpath -u "$RUNNER_TEMP")/nsis-$NSIS_VERSION.zip"
            url="https://downloads.sourceforge.net/project/nsis/NSIS%203/$NSIS_VERSION/nsis-$NSIS_VERSION.zip"
            # SourceForge redirects to a mirror; a bad one can fail or serve the
            # wrong bytes, so retry both and never unpack an unverified file.
            for attempt in 1 2 3 4; do
              if curl --fail --silent --show-error --location --retry 2 --connect-timeout 30 --max-time 300 --output "$zip" "$url" &&
                [[ "$(sha256sum < "$zip" | cut -d' ' -f1)" == "$NSIS_SHA256" ]]; then
                break
              fi
              rm -f "$zip"
              if (( attempt == 4 )); then
                echo "::error::Could not download NSIS $NSIS_VERSION with SHA-256 $NSIS_SHA256"
                exit 1
              fi
              echo "NSIS download failed or did not match its checksum (attempt $attempt); retrying" >&2
              sleep $((attempt * 15))
            done
            python -m zipfile -e "$zip" "$(dirname "$nsis")"
          fi
          version="$("$nsis/Bin/makensis.exe" -VERSION | tr -d '\r')"
          echo "makensis $version"
          [[ "$version" == "v$NSIS_VERSION" ]]
          # scripts/package-platform.py finds makensis on PATH.
          cygpath -w "$nsis/Bin" >> "$GITHUB_PATH"
      - name: Save Windows installer tool
        if: runner.os == 'Windows' && steps.nsis.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}/nsis-${{ env.NSIS_VERSION }}
          key: ${{ steps.nsis.outputs.cache-primary-key }}
      - name: Build native binaries
        run: |
          npm ci --prefix app
          npm run build --prefix app
          cargo build --locked --release --bin splash
          cargo build --locked --release --no-default-features --bin splash-server --target-dir target/headless
          python scripts/test-server-http.py target/headless/release/splash-server${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Package Windows installer / portable archive
        if: runner.os == 'Windows'
        run: python scripts/package-platform.py
      - name: Package Linux deb / AppImage / tarball
        if: runner.os == 'Linux'
        run: |
          scripts/fetch-appimagetool.sh
          python scripts/package-platform.py --appimagetool target/appimage-tools/appimagetool --runtime target/appimage-tools/runtime
          python scripts/verify-appimage.py target/distrib/*.AppImage
          dpkg-deb --info target/distrib/*.deb
          dpkg-deb -x target/distrib/*.deb target/deb-payload
          desktop-file-validate target/deb-payload/usr/share/applications/no.helgesverre.splash.desktop
          appstreamcli validate-tree --no-net target/deb-payload
      - name: Smoke Linux packages as an ordinary user in a fresh runtime
        if: runner.os == 'Linux'
        run: |
          docker build -f packaging/linux-smoke.Dockerfile -t splash-smoke .
          docker run --rm --security-opt apparmor=unconfined --security-opt seccomp=unconfined -v "$PWD/target/distrib:/packages:ro" splash-smoke
      - name: Smoke Windows installed application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/distrib/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'Splash installed'
          $result = Start-Process $installer.FullName -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Installer failed' }
          python scripts/test-desktop.py "$destination/splash.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed webview smoke failed' }
          Start-Process "$destination/Uninstall.exe" -ArgumentList '/S' -Wait
      - name: Package standalone macOS server
        if: runner.os == 'macOS'
        run: python scripts/package-platform.py
      - uses: actions/upload-artifact@v4
        with:
          name: splash-packages-${{ matrix.os }}
          path: target/distrib/*
          if-no-files-found: error
