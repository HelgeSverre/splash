name: Tag checked version
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-tag
  cancel-in-progress: false
jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      # Only trusted main push runs reach this checkout; never consume PR artifacts.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag the checked version and dispatch its release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: tag
        run: python3 scripts/release_pipeline.py
