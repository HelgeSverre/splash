name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_repeat:
        description: Run each browser test this many times (a flake burn-in)
        default: '1'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev pkg-config xvfb dbus-x11
      - name: Frontend and browser tests
        run: |
          npm ci --prefix app
          just frontend
          node --experimental-strip-types --test app/tests/*.test.ts
      - name: Native checks and tests
        run: |
          just check
          cargo test --manifest-path vendor/tiny_http/Cargo.toml --lib
      - name: Build native desktop and separate headless server
        run: |
          cargo build --locked --bin splash
          cargo build --locked --no-default-features --bin splash-server
      - name: Headless HTTP smoke
        run: python scripts/test-server-http.py target/debug/splash-server${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Native webview smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python scripts/test-desktop.py target/debug/splash
      - name: Native webview smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: python scripts/test-desktop.py target/debug/splash${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Check release tooling
        if: matrix.os == 'macos-15'
        run: |
          brew install actionlint shellcheck
          actionlint
          shellcheck scripts/import-signing-assets.sh scripts/package-release.sh scripts/package-pkg.sh scripts/fetch-appimagetool.sh packaging/AppRun e2e/fakes/agent e2e/fakes/gh e2e/fakes/github-ssh
          python -B scripts/test_release.py
          python -B scripts/test_release_pipeline.py
          bash scripts/quality/test-remote-docker-cleanup.sh
      - name: Preserve Windows native test binaries
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: splash-windows-native-tests
          path: target/debug/deps/splash-*.exe
          if-no-files-found: ignore
          retention-days: 1
  headless-linux:
    name: Linux server without GUI libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: headless
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix app && npm run build --prefix app
      - run: |
          cargo build --locked --no-default-features --bin splash-server
          cargo test --locked --no-default-features --test server
          python3 scripts/test-server-http.py target/debug/splash-server
          if ldd target/debug/splash-server | grep -Ei 'gtk|webkit|javascriptcore|libX11'; then
            echo 'Headless server unexpectedly links GUI libraries' >&2
            exit 1
          fi
  e2e:
    name: End-to-end (desktop UI and web version)
    runs-on: ubuntu-24.04
    # A manual burn-in (e2e_repeat > 1) runs the suite several times.
    timeout-minutes: ${{ fromJSON(inputs.e2e_repeat || '1') > 1 && 90 || 30 }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: e2e
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json
      # splash-web is the desktop build (default features) served over HTTP.
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev pkg-config
      - name: Build the frontend, the harness, the server and the fake agent
        run: |
          npm ci --prefix app
          npm run build --prefix app
          cargo build --locked --bin splash-web --bin fake-acp
          cargo build --locked --no-default-features --bin splash-server
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test types and selector rules
        working-directory: e2e
        run: npm run check
      - name: Browser tests
        working-directory: e2e
        env:
          REPEAT: ${{ inputs.e2e_repeat || '1' }}
        # A burn-in fails on any test that only passed on retry.
        run: |
          if [ "$REPEAT" = 1 ]; then npx playwright test
          else npx playwright test --repeat-each "$REPEAT" --fail-on-flaky-tests; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
  packages:
    name: Installable artifacts
    uses: ./.github/workflows/packages.yml
