name: CI

# Reused by Release so every artifact is checked at its exact commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: just check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just,shellcheck

      - name: Install actionlint
        run: brew install actionlint

      - name: Validate release automation
        run: |
          actionlint
          shellcheck scripts/import-signing-assets.sh scripts/package-release.sh
          python3 -B scripts/test_release.py

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      # rust-embed needs app/dist to exist at compile time.
      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Lint and test
        run: just check
